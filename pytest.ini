[pytest]
asyncio_mode = auto
testpaths = tests
markers =
    unit: Fast, in-process unit tests
    integration: Integration tests (require DB, in-process)
    contract: Pydantic schema/contract validation tests
    security: Security-focused tests
    e2e: End-to-end tests hitting the full API stack
    slow: Long-running benchmarks or scale tests
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
