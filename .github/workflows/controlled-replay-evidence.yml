name: Controlled Replay Evidence

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      max_queries:
        description: Number of recoverable SciFact queries to replay
        required: true
        default: "100"

jobs:
  scifact-controlled-replay:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
        python-version: "3.11"
        cache: pip
    - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
      with:
        version: "0.11.23"
    - run: uv sync --frozen --extra dev
    - name: Materialize hash-pinned SciFact snapshot
      run: uv run python scripts/download_scifact.py
    - name: Run real-data controlled replay
      run: >-
        uv run python -m apps.cli.run_controlled_replay_benchmark
        --max-queries ${{ inputs.max_queries }}
        --output results/controlled_replay/scifact_bm25.json
    - name: Require clean source provenance
      run: >-
        uv run python -c
        "import json; d=json.load(open('results/controlled_replay/scifact_bm25.json'));
        assert d['evidence_kind']=='controlled_replay';
        assert d['source']['dirty'] is False;
        assert all(v['recovery_rate']==1.0 for v in d['aggregates'].values())"
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: scifact-controlled-replay-${{ github.sha }}
        path: results/controlled_replay/scifact_bm25.json
        if-no-files-found: error
        retention-days: 90
