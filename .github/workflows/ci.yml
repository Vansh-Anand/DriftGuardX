name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: "pip"

    - name: Install package (dev extras only, no ML/infra deps for CI speed)
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Ruff lint check
      run: |
        ruff check .

    - name: Run unit and security tests (no integration/slow/benchmark tests)
      env:
        PYTHONPATH: "."
        DGX_MODE: "test"
        DGX_CAPABILITY_SECRET: "ci-test-secret-key"
        DGX_TRANSPORT_KEY: "ci-test-transport-key"
      run: |
        pytest tests/unit/ tests/security/ tests/contract/ -v -m "not integration and not slow and not e2e"

  security-and-sbom:
    runs-on: ubuntu-latest
    needs: [lint-and-test]
    steps:
    - uses: actions/checkout@v4

    - name: Generate SBOM (Syft)
      uses: anchore/sbom-action@v0
      with:
        path: .
        format: spdx-json
        output-file: reports/sbom.spdx.json

    - name: Vulnerability Scan (Trivy)
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'table'
        exit-code: '1'
        ignore-unfixed: true
        vuln-type: 'os,library'
        severity: 'CRITICAL,HIGH'
