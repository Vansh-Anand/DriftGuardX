name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: "pip"
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt
        
    - name: Lint and Type Check
      run: |
        black --check .
        mypy packages/ apps/
        
    - name: Run Tests (Unit, Integration, Security, E2E)
      run: |
        PYTHONPATH="." pytest tests/ -v
        
  frontend-build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: "18"
        
    - name: Build Web
      run: |
        cd apps/web
        npm ci
        npm run build
        
  security-and-sbom:
    runs-on: ubuntu-latest
    needs: [lint-and-test, frontend-build]
    steps:
    - uses: actions/checkout@v4
    
    - name: Run SBOM Generation & Scans
      run: |
        chmod +x scripts/generate_sbom_scan.py || true
        python scripts/generate_sbom_scan.py
