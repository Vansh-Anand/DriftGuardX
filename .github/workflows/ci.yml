name: CI Pipeline

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: driftguardx_ci
          POSTGRES_USER: driftguardx
          POSTGRES_PASSWORD: ci-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U driftguardx -d driftguardx_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

    - name: Set up Python 3.11
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
        python-version: "3.11"
        cache: "pip"

    - name: Set up uv
      uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
      with:
        version: "0.11.23"

    - name: Install frozen verification environment
      run: uv sync --frozen --extra dev --extra infra

    - name: Audit frozen Python dependencies
      run: uv run pip-audit -r requirements.lock

    - name: Ruff lint check
      run: uv run ruff check apps packages --select E9,F63,F7,F82

    - name: Formatting check for security-critical modules
      run: |
        uv run black --check apps/api/src/auth/auth.py apps/api/src/config.py apps/api/src/dependencies.py \
          apps/api/src/database.py apps/api/src/main.py apps/api/src/middleware.py \
          apps/api/src/pipeline/real_rag.py apps/api/src/routes apps/api/src/routers/manifest.py \
          apps/api/src/services/ingestion.py packages/rag_pipeline/src/adapters/llm_adapter.py \
          apps/cli/run_benchmark.py apps/worker/src/worker.py \
          packages/contracts/src/recovery_models.py packages/recovery/src/replay_executor.py \
          packages/recovery/src/validation.py packages/replay/src/engine.py \
          packages/replay/src/executor.py \
          packages/replay/src/exogenous_controller.py packages/rag_benchmark/src/fault_models.py \
          packages/rag_benchmark/src/fault_injection.py packages/rag_benchmark/src/rag_pipeline.py \
          packages/rag_benchmark/src/schedulers.py packages/rag_benchmark/src/controlled_replay.py \
          packages/detectors/src/calibration.py packages/evaluation/src/report_generator.py \
          apps/cli/run_controlled_replay_benchmark.py scripts/download_scifact.py

    - name: Strict type check for release-critical modules
      run: |
        uv run mypy --strict --python-version 3.11 --platform linux \
          --explicit-package-bases --follow-imports=silent \
          apps/api/src/auth/auth.py apps/api/src/config.py apps/api/src/dependencies.py \
          apps/api/src/database.py apps/api/src/main.py apps/api/src/middleware.py \
          apps/api/src/jobs/orchestrator.py apps/api/src/routes/jobs.py \
          apps/api/src/routes/providers.py apps/api/src/routes/graph.py apps/api/src/routes/runs.py \
          apps/api/src/routes/replays.py apps/api/src/routes/telemetry.py apps/api/src/schemas.py \
          apps/api/src/services/ingestion.py apps/api/src/pipeline/real_rag.py \
          packages/rag_pipeline/src/adapters/llm_adapter.py apps/cli/run_benchmark.py \
          apps/worker/src/worker.py packages/contracts/src/evidence.py \
          packages/contracts/src/models.py packages/contracts/src/recovery_models.py \
          packages/ledger/src/schema.py packages/ledger/src/export.py \
          packages/recovery/src/replay_executor.py packages/recovery/src/validation.py \
          packages/replay/src/engine.py packages/replay/src/executor.py \
          packages/replay/src/planner.py packages/replay/src/sandbox.py \
          packages/replay/src/exogenous_controller.py packages/rag_benchmark/src/fault_models.py \
          packages/rag_benchmark/src/controlled_replay.py packages/detectors/src/calibration.py \
          packages/evaluation/src/report_generator.py apps/cli/run_controlled_replay_benchmark.py \
          scripts/download_scifact.py \
          packages/utils/src/version.py

    - name: Upgrade PostgreSQL schema to head
      working-directory: apps/api
      env:
        DATABASE_URL: postgresql+asyncpg://driftguardx:ci-password@localhost:5432/driftguardx_ci
        DGX_MODE: test
      run: uv run alembic upgrade head

    - name: Validate PostgreSQL model and migration parity
      working-directory: apps/api
      env:
        DATABASE_URL: postgresql+asyncpg://driftguardx:ci-password@localhost:5432/driftguardx_ci
        DGX_MODE: test
      run: |
        set +e
        output="$(uv run alembic check 2>&1)"
        status=$?
        printf '%s\n' "$output"
        if [ "$status" -ne 0 ]; then
          output="${output//'%'/'%25'}"
          output="${output//$'\r'/'%0D'}"
          output="${output//$'\n'/'%0A'}"
          printf '::error title=PostgreSQL migration parity failed::%s\n' "$output"
          exit "$status"
        fi

    - name: Validate PostgreSQL full downgrade
      working-directory: apps/api
      env:
        DATABASE_URL: postgresql+asyncpg://driftguardx:ci-password@localhost:5432/driftguardx_ci
        DGX_MODE: test
      run: |
        set +e
        output="$(uv run alembic downgrade base 2>&1)"
        status=$?
        printf '%s\n' "$output"
        if [ "$status" -ne 0 ]; then
          output="${output//'%'/'%25'}"
          output="${output//$'\r'/'%0D'}"
          output="${output//$'\n'/'%0A'}"
          printf '::error title=PostgreSQL full downgrade failed::%s\n' "$output"
          exit "$status"
        fi

    - name: Validate PostgreSQL clean re-upgrade
      working-directory: apps/api
      env:
        DATABASE_URL: postgresql+asyncpg://driftguardx:ci-password@localhost:5432/driftguardx_ci
        DGX_MODE: test
      run: uv run alembic upgrade head

    - name: Run complete Python suite, including service-backed integration smoke
      env:
        PYTHONPATH: "."
        DGX_MODE: "test"
        DATABASE_URL: postgresql+asyncpg://driftguardx:ci-password@localhost:5432/driftguardx_ci
        REDIS_URL: redis://localhost:6379/0
        DGX_CAPABILITY_SECRET: "ci-test-secret-key"
        DGX_TRANSPORT_KEY: "ci-test-transport-key"
      run: |
        uv run pytest -q

  web-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
    - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
      with:
        node-version: "20"
        cache: npm
        cache-dependency-path: apps/web/package-lock.json
    - run: npm ci
    - name: Audit production web dependencies
      run: npm audit --omit=dev --audit-level=high
    - run: npx playwright install --with-deps chromium
    - name: Build production web application
      env:
        DGX_VERIFICATION_STATUS: ci-verified
      run: |
        set +e
        output="$(npm run build 2>&1)"
        status=$?
        printf '%s\n' "$output"
        if [ "$status" -ne 0 ]; then
          output="${output//'%'/'%25'}"
          output="${output//$'\r'/'%0D'}"
          output="${output//$'\n'/'%0A'}"
          printf '::error title=Production web build failed::%s\n' "$output"
          exit "$status"
        fi
    - run: npm run test:e2e

  container-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
        - name: api
          file: apps/api/Dockerfile
        - name: worker
          file: apps/worker/Dockerfile
        - name: web
          file: apps/web/Dockerfile
        - name: replay
          file: apps/replay/Dockerfile
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
    - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
    - name: Build ${{ matrix.name }} image without publishing
      uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
      with:
        context: .
        file: ${{ matrix.file }}
        push: false
        tags: driftguardx-${{ matrix.name }}:${{ github.sha }}
        cache-from: type=gha,scope=${{ matrix.name }}
        cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  security-and-sbom:
    runs-on: ubuntu-latest
    needs: [lint-and-test]
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

    - name: Generate SBOM (Syft)
      uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
      with:
        path: .
        format: spdx-json
        output-file: reports/sbom.spdx.json

    - name: Vulnerability Scan (Trivy)
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'table'
        exit-code: '1'
        ignore-unfixed: true
        vuln-type: 'os,library'
        severity: 'CRITICAL,HIGH'
