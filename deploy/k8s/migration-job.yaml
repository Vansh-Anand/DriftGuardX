apiVersion: batch/v1
kind: Job
metadata:
  name: driftguard-migration
  labels:
    app: driftguard-migration
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: driftguard-migration
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
      - name: migration
        image: ghcr.io/driftguardx/api@sha256:b5a2d9b2f6b8b0e7a2b9e8b7d6a5f4c3b2a1e0f9d8c7b6a5f4e3d2c1b0a9f8e7
        imagePullPolicy: IfNotPresent
        command: ["alembic", "upgrade", "head"]
        envFrom:
        - secretRef:
            name: driftguard-secrets
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "250m"
            memory: "256Mi"
      restartPolicy: Never
