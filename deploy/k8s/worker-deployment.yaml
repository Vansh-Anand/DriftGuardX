apiVersion: apps/v1
kind: Deployment
metadata:
  name: driftguard-worker
  labels:
    app: driftguard-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: driftguard-worker
  template:
    metadata:
      labels:
        app: driftguard-worker
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
      - name: worker
        image: ghcr.io/driftguardx/worker@sha256:f1a2d9b2f6b8b0e7a2b9e8b7d6a5f4c3b2a1e0f9d8c7b6a5f4e3d2c1b0a9f8e7
        imagePullPolicy: IfNotPresent
        command: ["arq", "apps.worker.main.WorkerSettings"]
        envFrom:
        - secretRef:
            name: driftguard-secrets
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "1000m"
            memory: "1Gi"
        # No HTTP endpoints typically on standard ARQ worker unless exposing metrics
