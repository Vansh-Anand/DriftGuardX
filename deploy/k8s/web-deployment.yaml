apiVersion: apps/v1
kind: Deployment
metadata:
  name: driftguard-web
  labels:
    app: driftguard-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: driftguard-web
  template:
    metadata:
      labels:
        app: driftguard-web
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
      containers:
      - name: web
        image: ghcr.io/driftguardx/web@sha256:d8a2d9b2f6b8b0e7a2b9e8b7d6a5f4c3b2a1e0f9d8c7b6a5f4e3d2c1b0a9f8e7
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "250m"
            memory: "256Mi"
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: driftguard-web
spec:
  selector:
    app: driftguard-web
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
