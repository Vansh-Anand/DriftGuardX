apiVersion: apps/v1
kind: Deployment
metadata:
  name: driftguard-web
  labels:
    app: driftguard-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: driftguard-web
  template:
    metadata:
      labels:
        app: driftguard-web
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
      containers:
      - name: web
        image: driftguard/web:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 3000
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "250m"
            memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: driftguard-web
spec:
  selector:
    app: driftguard-web
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
