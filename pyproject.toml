[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "driftguardx"
version = "2.0.0rc1"
description = "DriftGuard-X v2: Agentic RAG Reliability Platform"
requires-python = ">=3.11,<3.13"
license = { text = "PRIVATE — All Rights Reserved" }
readme = "README.md"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy[asyncio]>=2.0.31",
    "alembic>=1.13.0",
    "aiosqlite>=0.20.0",
    "opentelemetry-api>=1.25.0",
    "opentelemetry-sdk>=1.25.0",
    "structlog>=24.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
    "cryptography>=50.0.0",
    "numpy>=1.26.0",
    "networkx>=3.0.0",
    "psutil>=6.0.0",
    "pyjwt[crypto]>=2.10.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "black>=24.4.2",
    "pip-audit>=2.9.0",
    "pytest-httpx>=0.30.0",
    "hypothesis>=6.100.0",
]
ml = [
    "torch>=2.0.0",
    "torch-geometric>=2.5.0",
    "sentence-transformers>=2.7.0",
    "scipy>=1.11.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
]
infra = [
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "redis>=5.0.7",
    "pgvector>=0.2.5",
    "minio>=7.2.5",
    "docker>=7.0.0",
    "cloudpickle>=3.0.0",
    "arq>=0.26.0",
]
benchmark = [
    "openai>=1.14.0",
    "tiktoken>=0.6.0",
    "beir>=2.0.0",
    "pyarrow>=23.0.1",
]

[tool.hatch.build.targets.wheel]
packages = [
    "apps/api/src",
    "apps/worker/src",
    "packages/contracts/src",
    "packages/detectors/src",
    "packages/diffusion/src",
    "packages/evaluation/src",
    "packages/graph/src",
    "packages/ingestion/src",
    "packages/ledger/src",
    "packages/memory/src",
    "packages/policy/src",
    "packages/provider_registry/src",
    "packages/rag_benchmark/src",
    "packages/rag_pipeline/src",
    "packages/rationale/src",
    "packages/recovery/src",
    "packages/replay/src",
    "packages/sdk/src",
    "packages/trace_sdk/src",
    "packages/utils/src",
]

# ─── Ruff ─────────────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [".venv", "dist", "build", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "TCH", "ANN", "S", "RUF"]
ignore = [
    "S101",    # use of assert (fine in tests)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "ANN"]
"examples/**/*.py" = ["S101", "ANN"]
"**/migrations/**/*.py" = ["ANN"]

# ─── Black ────────────────────────────────────────────────────────────────────
[tool.black]
target-version = ["py311"]
line-length = 100

# ─── MyPy ─────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
strict = true
explicit_package_bases = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = false
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["alembic.*", "sqlalchemy.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "cloudpickle.*", "datasets.*", "docker.*", "matplotlib.*", "mlflow.*",
    "openai.*", "presidio_analyzer.*", "psutil.*", "ragas.*", "scipy.*",
    "seaborn.*", "sentence_transformers.*", "torch.*", "torch_geometric.*",
]
ignore_missing_imports = true

# ─── Pytest ───────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    "--cov=apps",
    "--cov=packages",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests (require DB + Redis)",
    "contract: Schema/contract tests",
    "security: Security tests",
    "e2e: End-to-end tests",
    "slow: Slow tests",
]

# ─── Coverage ─────────────────────────────────────────────────────────────────
[tool.coverage.run]
source = ["apps", "packages"]
omit = ["*/migrations/*", "*/alembic/*", "*/__pycache__/*", "*/tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
