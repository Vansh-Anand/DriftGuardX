[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "driftguardx"
version = "0.1.0"
description = "DriftGuard-X v2: Agentic RAG Reliability Platform"
requires-python = ">=3.11"
license = { text = "PRIVATE — All Rights Reserved" }
readme = "README.md"

[tool.hatch.build.targets.wheel]
packages = [
    "apps/api/src",
    "apps/worker/src",
    "packages/trace_sdk/src",
    "packages/contracts/src",
    "packages/replay/src",
    "packages/policy/src",
    "packages/ledger/src",
    "packages/evaluation/src",
]

# ─── Ruff ─────────────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py311"
line-length = 100
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "TCH", "ANN", "S", "RUF"]
ignore = [
    "ANN101",  # missing type annotation for self
    "ANN102",  # missing type annotation for cls
    "S101",    # use of assert (fine in tests)
]
exclude = [".venv", "dist", "build", "__pycache__"]

[tool.ruff.per-file-ignores]
"tests/**/*.py" = ["S101", "ANN"]
"examples/**/*.py" = ["S101", "ANN"]
"**/migrations/**/*.py" = ["ANN"]

# ─── Black ────────────────────────────────────────────────────────────────────
[tool.black]
target-version = ["py311"]
line-length = 100

# ─── MyPy ─────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = false
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["alembic.*", "sqlalchemy.*"]
ignore_missing_imports = true

# ─── Pytest ───────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    "--cov=apps",
    "--cov=packages",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests (require DB + Redis)",
    "contract: Schema/contract tests",
    "security: Security tests",
    "e2e: End-to-end tests",
    "slow: Slow tests",
]

# ─── Coverage ─────────────────────────────────────────────────────────────────
[tool.coverage.run]
source = ["apps", "packages"]
omit = ["*/migrations/*", "*/alembic/*", "*/__pycache__/*", "*/tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
